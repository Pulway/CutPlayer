name: Release

# 打 tag（如 v0.1.1）→ 自动构建 DMG 并创建 GitHub Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.1.1）"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖（FFmpeg / mpv）
        run: brew install ffmpeg mpv

      - name: 读取版本号
        id: ver
        run: echo "version=$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)" >> "$GITHUB_OUTPUT"

      # 防呆：tag 与 Info.plist 版本不一致时直接失败，避免发出错版本
      - name: 校验版本一致性
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="${{ steps.ver.outputs.version }}"
          [ "$TAG" = "$VER" ] || { echo "✘ tag($TAG) 与 Info.plist($VER) 不一致"; exit 1; }

      - name: 打包 App
        run: ./scripts/build_app.sh arm64 release

      - name: 打包 DMG
        run: ./scripts/make_dmg.sh "${{ steps.ver.outputs.version }}" arm64

      - name: 生成校验和
        run: |
          shasum -a 256 "build/CutPlayer-${{ steps.ver.outputs.version }}-arm64.dmg" > build/SHA256SUMS.txt
          cat build/SHA256SUMS.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: CutPlayer ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            ## 安装

            1. 下载下方 `CutPlayer-${{ steps.ver.outputs.version }}-arm64.dmg`
            2. 拖进「应用程序」
            3. **首次打开需右键 → 打开**（本地构建、未做 Apple 公证，详见 DMG 内《安装说明.txt》）

            系统要求：Apple Silicon（M 系列）Mac + macOS 14 或更高。
            详细用法见仓库内 [docs/使用手册.md](docs/使用手册.md)。
          files: |
            build/CutPlayer-${{ steps.ver.outputs.version }}-arm64.dmg
            build/SHA256SUMS.txt
